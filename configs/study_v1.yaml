# Pre-registration for the main study (spec §3, §8, §9, §12).
# STATUS: DRAFT. Values are proposed design choices, not results. Freeze (set frozen: true and
# record the commit hash) before any sealed-test evaluation; log later deviations in
# docs/research_decisions.md.
study_id: neurosculpt_v1
frozen: false

model:
  arch: mlp
  hidden: [128, 64]
  activation: relu
  base_seeds: [0, 1, 2]          # spec minimum; under review (compute permits more)

data:
  base: mnist
  corruption: null               # choose ONE MNIST-C family before inspecting results
  transfer_corruption: null      # unoptimized family for interference check
  split_by: original_image_id
  edit_search: {target: 256, preserve: 512}
  calibration: {target: null, preserve: null}
  edit_selection: {target: null, preserve: null}

edit:
  parameter_name: layers.1.weight   # W2, shape [64, 128]
  k: 8
  d: 8
  radius_fracs: [0.01, 0.03, 0.10]  # rho / ||W2[:, S]||_F, selected on edit_selection

objective:
  lambda_ce: null                # tuned on edit_selection only
  lambda_kl: null
  mu: null
  preserve_gate_pp: 0.5          # max clean-accuracy drop (percentage points)

search:
  optimizer: coordinate          # coordinate | cmaes | random
  budget_full_batch_equiv: 240   # end-to-end, includes localization and basis forwards
  localization_prescreen: 32

methods:                         # spec §9.1
  - {code: BASE}
  - {code: RAND,        support: random, basis: random}
  - {code: SPEC,        support: random, basis: spectral}
  - {code: BEHAV,       support: random, basis: behavior}
  - {code: CAUS-RAND,   support: causal, basis: random}
  - {code: CAUS-SPEC,   support: causal, basis: spectral}
  - {code: NEUROSCULPT, support: causal, basis: behavior}
  - {code: ADAM-MASK,   support: matched, basis: free, optimizer: adam}

primary_comparison: [NEUROSCULPT, RAND]
