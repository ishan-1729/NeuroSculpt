# Fast end-to-end smoke configuration. Mock LLM, no API calls. Not for any reported result.
study_id: neurosculpt_smoke
frozen: false

target_model:
  sizes: [49, 24, 16, 10]
  input: {source: mnist, downsample: avg_pool2d, kernel: 4, range: [0, 1]}
seeds:
  calibration: [100]

task_a:
  families: [F1_sign_flip_rowset_x_colset, F4_stealth_balance_matched]
  site_sampling: uniform_any_contiguity

api:
  calls: [evaluate, evaluate_batch, forward]
  patch_language: [layers.1.weight, layers.1.bias, layers.2.weight, layers.2.bias]
  adaptation_batch: {target: 64, preserve: 64}

llm:
  backend: mock                    # scripted mock LLM exercises the harness end to end

search:
  pure_blackbox_arms: [CMA-FULL, RANDOM, TEMPLATE-SEARCH]
  curve_budgets_fbe: [1, 4, 16, 64]
  null_restarts: 4

baselines: [ZERO, BALANCE-MATCH]
